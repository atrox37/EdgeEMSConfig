name: Build and Publish Tauri (Win/Linux/macOS) to S3

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    environment: prod
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x86_64
            bundle_subdir: msi
            bundle_root: src-tauri/target/release/bundle
          - os: ubuntu-latest
            artifact: linux-x86_64
            bundle_subdir: appimage
            bundle_root: src-tauri/target/release/bundle
          - os: ubuntu-22.04-arm
            artifact: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
            bundle_subdir: appimage
            bundle_root: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle
          - os: macos-latest
            artifact: darwin-aarch64
            rust_target: aarch64-apple-darwin
            bundle_subdir: dmg
            bundle_root: src-tauri/target/aarch64-apple-darwin/release/bundle
          - os: macos-latest
            artifact: darwin-x86_64
            rust_target: x86_64-apple-darwin
            bundle_subdir: dmg
            bundle_root: src-tauri/target/x86_64-apple-darwin/release/bundle

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            pkg-config \
            patchelf \
            xdg-utils

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Update version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Updating version to $VERSION"

          node -e "
          const fs = require('fs');
          const version = '$VERSION';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const tauriConf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          tauriConf.version = version;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2) + '\n');

          let cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          cargoToml = cargoToml.replace(/^version = \".*\"/m, 'version = \"' + version + '\"');
          fs.writeFileSync('src-tauri/Cargo.toml', cargoToml);

          console.log('Version updated successfully to', version);
          "

          echo "Verification:"
          echo "package.json: $(grep '\"version\"' package.json)"
          echo "tauri.conf.json: $(grep '\"version\"' src-tauri/tauri.conf.json)"
          echo "Cargo.toml: $(grep '^version' src-tauri/Cargo.toml)"

      - name: Build app (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.rust_target && format('--target {0}', matrix.rust_target) || '' }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-bundle
          path: ${{ matrix.bundle_root }}/${{ matrix.bundle_subdir }}/

      - name: Upload macOS updater artifact
        if: startsWith(matrix.artifact, 'darwin-')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-updater
          path: |
            ${{ matrix.bundle_root }}/macos/*.app.tar.gz
            ${{ matrix.bundle_root }}/macos/*.sig
          if-no-files-found: error

  publish:
    name: Publish to S3
    environment: prod
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug artifacts structure
        run: |
          echo "Artifacts directory structure:"
          ls -la artifacts/ || echo "artifacts directory not found"
          echo ""
          echo "All artifacts:"
          find artifacts -type f -o -type d | head -50

      - name: Organize dist for all platforms
        run: |
          mkdir -p dist

          copy_artifact() {
            local src="$1"
            local dest="$2"
            local label="$3"
            if [ -d "artifacts/$src" ]; then
              mkdir -p "$dest"
              cp -R "artifacts/$src/"* "$dest/"
              echo "✓ $label"
            else
              echo "⚠ $label not found"
            fi
          }

          copy_artifact windows-x86_64-bundle dist/windows "Windows x86_64"
          copy_artifact linux-x86_64-bundle dist/linux "Linux x86_64"
          copy_artifact linux-aarch64-bundle dist/linux-arm64 "Linux ARM64"
          copy_artifact darwin-x86_64-bundle dist/macos-x86_64 "macOS Intel"
          copy_artifact darwin-x86_64-updater dist/macos-x86_64 "macOS Intel updater"
          copy_artifact darwin-aarch64-bundle dist/macos-aarch64 "macOS Apple Silicon"
          copy_artifact darwin-aarch64-updater dist/macos-aarch64 "macOS Apple Silicon updater"

          echo ""
          echo "Final dist structure:"
          ls -R dist

      - name: Generate latest.json
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: node script/generate-latest.js ${{ github.ref_name }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload dist and latest.json to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          TAG=${GITHUB_REF_NAME}
          aws s3 sync dist "s3://${S3_BUCKET}/releases/${TAG}/"
          aws s3 cp latest.json "s3://${S3_BUCKET}/latest.json" --content-type "application/json"
